
name: Deploy IMPERIUM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract IMPERIUM
        run: |
          mkdir site
          unzip -q IMPERIUM-V7.72-Mobile-Edition.zip -d site
          test -f site/imperium/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/imperium

      - name: Publish game
        uses: actions/deploy-pages@v4
